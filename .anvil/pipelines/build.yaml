pipeline:
    name: build
    stages:
        - name: dependencies
          tasks:
            - name: download
              command: go
              args:
                - mod
                - download
            - name: verify
              command: go
              args:
                - mod
                - verify
        - name: compile
          tasks:
            # Release binaries follow the plugin asset naming contract:
            # eka-mcp-<os>-<arch> (windows: eka-mcp-<os>-<arch>.exe) —
            # exactly what `eka plugin install mcp` resolves. The version
            # is stamped into pack.Version via ldflags so the released
            # binary reports the tagged version in its manifest (and MCP
            # serverInfo). pack.Version is a var (not a const) precisely
            # to allow this stamping; anvil.yaml must carry the same
            # version (scripts/bump.sh keeps both in sync). The asset set
            # (linux/darwin/windows × amd64/arm64) matches eka-cli.
            #
            # NOTE the -X target: package pack lives at the MODULE ROOT
            # (pack.go next to go.mod), so its import path is the module
            # path itself — github.com/maleolabs/eka-mcp — NOT .../pack.
            # Stamping github.com/maleolabs/eka-mcp/pack.Version would
            # silently no-op (the linker has no such symbol) and the
            # release would ship the stale source version.
            - name: linux-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X github.com/maleolabs/eka-mcp.Version=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/eka-mcp-linux-amd64 ./cmd/eka-mcp
              env:
                GOOS: linux
                GOARCH: amd64
            - name: linux-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X github.com/maleolabs/eka-mcp.Version=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/eka-mcp-linux-arm64 ./cmd/eka-mcp
              env:
                GOOS: linux
                GOARCH: arm64
            - name: darwin-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X github.com/maleolabs/eka-mcp.Version=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/eka-mcp-darwin-amd64 ./cmd/eka-mcp
              env:
                GOOS: darwin
                GOARCH: amd64
            - name: darwin-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X github.com/maleolabs/eka-mcp.Version=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/eka-mcp-darwin-arm64 ./cmd/eka-mcp
              env:
                GOOS: darwin
                GOARCH: arm64
            # Windows binaries use the .exe suffix — the asset naming
            # contract resolved by `eka plugin install mcp`.
            - name: windows-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X github.com/maleolabs/eka-mcp.Version=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/eka-mcp-windows-amd64.exe ./cmd/eka-mcp
              env:
                GOOS: windows
                GOARCH: amd64
            - name: windows-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X github.com/maleolabs/eka-mcp.Version=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/eka-mcp-windows-arm64.exe ./cmd/eka-mcp
              env:
                GOOS: windows
                GOARCH: arm64
