# EKA AI Skill Pack — manifest
#
# Version pinning contract: the pack references CLI behavior. Check the
# local CLI against requiresEka before trusting the pack's command
# surface, and re-verify with `eka --help` when in doubt.

pack:
  name: eka-ai-skill-pack
  version: 1.0.3
  status: stable
  requiresEka: ">= 1.16.0"
  anchorDecision: "reference/decisions/adr-022-ai-skill-pack.md"
  installCommand: "eka-mcp configure --target opencode|claude|codex [--with-skills|--with-commands|--with-all] --json (pack-distribution vehicle per ADR-030; eka-cli exposes no install surface)"

skills:
  - name: eka-router
    path: eka-router/SKILL.md
    role: routing — pick the right skill per task
  - name: eka-orientation
    path: eka-orientation/SKILL.md
    role: the EKA mental model
  - name: eka-project-understanding
    path: eka-project-understanding/SKILL.md
    role: context-first project context
  - name: eka-knowledge-retrieval
    path: eka-knowledge-retrieval/SKILL.md
    role: eka get / context / view — the retrieval surface
  - name: eka-knowledge-authoring
    path: eka-knowledge-authoring/SKILL.md
    role: create knowledge — draft → validate → publish
    resources:
      - eka-knowledge-authoring/templates/README.md
      - eka-knowledge-authoring/templates/drafts/
  - name: eka-knowledge-modification
    path: eka-knowledge-modification/SKILL.md
    role: change knowledge — revisions and transitions
  - name: eka-knowledge-review
    path: eka-knowledge-review/SKILL.md
    role: review with EKA-native validation
  - name: eka-adoption
    path: eka-adoption/SKILL.md
    role: bring non-EKA projects into EKA (migration and greenfield)
  - name: eka-engineering-workflow
    path: eka-engineering-workflow/SKILL.md
    role: EKA and software development, methodology-independent
  - name: eka-troubleshooting
    path: eka-troubleshooting/SKILL.md
    role: refusal classes, exit codes, fixes
  - name: eka-feedback
    path: eka-feedback/SKILL.md
    role: report EKA shortcomings — write + publish feedback (ADR-026)
  - name: eka-shr-builder
    path: eka-shr-builder/SKILL.md
    role: build shr sharing objects — EKA-to-EKA and audited non-EKA spike, reusable for agents
  - name: eka-shared-knowledge
    path: eka-shared-knowledge/SKILL.md
    role: consume shared knowledge — discover, inspect and apply shr snapshots from other projects without cloning the source
    resources:
      - eka-shared-knowledge/references/consumption-levels.md
      - eka-shared-knowledge/references/durability.md

supporting:
  - path: commands/README.md
    role: user-invoked agent workflows — install, provider mapping, resume architecture
  - path: commands/eka-discuss.md
    role: planning discussion command (idea → discuss → propose → validate → approved → publish; no code)
  - path: commands/eka-execute.md
    role: autonomous execution command (approved planning, EKA state machine, checkpoint + resume)
  - path: commands/eka-share.md
    role: share command — reusable prompt to build and publish shr sharing objects (EKA and audited non-EKA) for agents
  - path: docs/installation.md
    role: installation and discovery
  - path: docs/workflow.md
    role: the full AI workflow
  - path: docs/mcp-boundary.md
    role: future MCP integration boundary
  - path: docs/reference-project-validation.md
    role: validation evidence against the Reference Project
  - path: scripts/smoke-test.sh
    role: executable smoke test over the reference project

maintenance:
  regenerateTemplates: "for each token family: eka new <ns>/<type>:template (--dimension for knowledge types); see eka-knowledge-authoring/templates/README.md"
  verifyPack: "EKA_PATH=<eka> skills/scripts/smoke-test.sh"
  bumpPolicy: "pack version bumps when the skill set, command surface references, or templates change"
